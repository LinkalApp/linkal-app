name: CI
on:
  push:
    branches: [develop,release-*]

jobs:
  devops:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      - name: 🛠️ Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🏗️ Build with Gradle (IMPORTANT for CodeQL)
        run: ./gradlew build

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

      - name: 🧪 Run Tests & Generate Coverage
        run: ./gradlew app:jacocoTestReport

      - name: 🔍 Lint
        run: ./gradlew lint

      - name: 📊 SonarCloud Analysis
        run: >
          ./gradlew sonar
          -Dsonar.projectKey=LinkalApp_linkal-app
          -Dsonar.organization=linkalapp
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.cpd.exclusions=**/activities/**,**/models/requests/**,**/models/responses/**